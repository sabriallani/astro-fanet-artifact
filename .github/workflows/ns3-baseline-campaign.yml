name: baseline comparison campaign

# Executes A3D-BSM against the four re-implemented broadcast-suppression
# baselines (SF, PR, CB, SBA) on an identical stack, mobility trace and seed
# set, and publishes the raw per-run CSVs.  Everything the manuscript reports
# for the comparison must come out of this workflow.

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/baseline-comparison-v2

permissions:
  contents: write

jobs:
  baseline-campaign:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repository tests
        run: python -m unittest discover -s tests -v

      - name: Configure Waf compatibility
        shell: bash
        run: |
          set -euo pipefail
          root=ns-allinone-3.29/ns-3.29
          (cd "$root" && ./waf --version)
          python - "$root" <<'PY'
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          replacements = 0
          for path in root.glob('.waf*/waflib/Utils.py'):
              text = path.read_text()
              updated = text.replace("open(fname,m)as f", "open(fname,m.replace('U',''))as f")
              if updated != text:
                  path.write_text(updated)
                  replacements += 1
          print(root, "patched", replacements)
          if replacements == 0:
              raise SystemExit(f"No generated Waf Utils.py found in {root}")
          PY

      - name: Build simulator
        shell: bash
        run: |
          set -euo pipefail
          cd ns-allinone-3.29/ns-3.29
          ./waf configure --disable-werror
          ./waf build -j2

      - name: Run baseline comparison matrix
        shell: bash
        run: |
          set -euo pipefail
          root=ns-allinone-3.29/ns-3.29
          output=results/baseline-campaign
          mkdir -p "$root/$output"
          : > "$root/$output/status.tsv"
          for protocol in astro sf pr cb sba; do
            for n_uavs in 10 20; do
              for mobility in gm3d rpgm; do
                for seed in 3001 3002 3003 3004 3005; do
                  label="${protocol}_n${n_uavs}_${mobility}_s${seed}"
                  out_dir="$root/$output/$label"
                  mkdir -p "$out_dir"
                  if (
                    cd "$root"
                    ./waf --run "astro-fanet-sim --protocol=${protocol} --nUavs=${n_uavs} --mobility=${mobility} --seed=${seed} --simTime=30 --pktRate=1.0 --byzFraction=0.0 --outputDir=${output}/${label}"
                  ) > "$out_dir/${label}.console.log" 2>&1; then
                    printf '%s\tOK\n' "$label" >> "$root/$output/status.tsv"
                  else
                    printf '%s\tFAIL\n' "$label" >> "$root/$output/status.tsv"
                  fi
                done
              done
            done
          done
          echo "=== campaign status ==="
          sort "$root/$output/status.tsv" | uniq -c -f1 | head -20
          awk -F'\t' '$2=="OK"{ok++} $2=="FAIL"{fail++} END{print "OK="ok" FAIL="fail}' "$root/$output/status.tsv"

      - name: Aggregate campaign CSVs
        if: always()
        run: |
          python paper-reproduction/aggregate_baseline_campaign.py \
            --results ns-allinone-3.29/ns-3.29/results/baseline-campaign \
            --output paper-reproduction/baseline_campaign_summary.csv \
            --raw-output paper-reproduction/baseline_campaign_raw.csv

      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-comparison-campaign
          if-no-files-found: error
          path: |
            ns-allinone-3.29/ns-3.29/results/baseline-campaign/**
            paper-reproduction/baseline_campaign_summary.csv
            paper-reproduction/baseline_campaign_raw.csv

      - name: Publish campaign evidence
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/baseline-publish
          cp -r ns-allinone-3.29/ns-3.29/results/baseline-campaign /tmp/baseline-publish/ || true
          cp paper-reproduction/baseline_campaign_summary.csv /tmp/baseline-publish/ || true
          cp paper-reproduction/baseline_campaign_raw.csv /tmp/baseline-publish/ || true
          git checkout --orphan baseline-campaign-publish
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p published-results
          cp -r /tmp/baseline-publish/. published-results/ || true
          printf '%s\n' "${GITHUB_SHA}" > published-results/source_commit.txt
          git add published-results
          git commit -m "Publish baseline comparison campaign [skip ci]"
          git push origin HEAD:baseline-campaign --force
