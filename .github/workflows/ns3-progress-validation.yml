name: paired progress-aware validation

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/progress-aware-geocast

permissions:
  contents: write

jobs:
  paired-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repository tests
        run: python -m unittest discover -s tests -v

      - name: Prepare reference checkout
        run: |
          set -euo pipefail
          git fetch origin ci/mobile-actions
          mkdir -p /tmp/reference
          git archive origin/ci/mobile-actions | tar -x -C /tmp/reference

      - name: Configure Waf compatibility
        shell: bash
        run: |
          set -euo pipefail
          for root in ns-allinone-3.29/ns-3.29 /tmp/reference/ns-allinone-3.29/ns-3.29; do
            (cd "$root" && ./waf --version)
            python - "$root" <<'PY'
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          replacements = 0
          for path in root.glob('.waf*/waflib/Utils.py'):
              text = path.read_text()
              updated = text.replace("open(fname,m)as f", "open(fname,m.replace('U',''))as f")
              if updated != text:
                  path.write_text(updated)
                  replacements += 1
          print(root, "patched", replacements)
          if replacements == 0:
              raise SystemExit(f"No generated Waf Utils.py found in {root}")
          PY
          done

      - name: Build reference and experimental variants
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/reference/ns-allinone-3.29/ns-3.29 && ./waf configure --disable-werror && ./waf build -j2)
          (cd ns-allinone-3.29/ns-3.29 && ./waf configure --disable-werror && ./waf build -j2)

      - name: Run paired controlled simulations
        shell: bash
        run: |
          set -euo pipefail
          run_variant() {
            local root="$1"
            local output="$2"
            mkdir -p "$root/$output"
            : > "$root/$output/status.tsv"
            while read -r n_uavs mobility seed; do
              label="n${n_uavs}_${mobility}_s${seed}"
              out_dir="$root/$output/$label"
              mkdir -p "$out_dir"
              if (
                cd "$root"
                ./waf --run "astro-fanet-sim --protocol=astro --nUavs=${n_uavs} --mobility=${mobility} --seed=${seed} --simTime=30 --pktRate=1.0 --byzFraction=0.0 --outputDir=${output}/${label}"
              ) > "$out_dir/${label}.console.log" 2>&1; then
                printf '%s\t%s\tOK\n' "$label" "$root" >> "$root/$output/status.tsv"
              else
                printf '%s\t%s\tFAIL\n' "$label" "$root" >> "$root/$output/status.tsv"
              fi
            done <<'MATRIX'
          10 gm3d 3001
          10 gm3d 3002
          10 gm3d 3003
          20 gm3d 3001
          20 gm3d 3002
          20 gm3d 3003
          20 rpgm 3001
          20 rpgm 3002
          20 rpgm 3003
          MATRIX
          }
          run_variant /tmp/reference/ns-allinone-3.29/ns-3.29 results/paired-reference
          run_variant ns-allinone-3.29/ns-3.29 results/paired-experimental

      - name: Compare paired CSV results
        run: |
          python paper-reproduction/compare_progress_validation.py \
            --reference /tmp/reference/ns-allinone-3.29/ns-3.29/results/paired-reference \
            --experimental ns-allinone-3.29/ns-3.29/results/paired-experimental \
            --output paper-reproduction/progress_validation_summary.csv

      - name: Upload paired evidence
        uses: actions/upload-artifact@v4
        with:
          name: progress-aware-paired-validation
          if-no-files-found: error
          path: |
            ns-allinone-3.29/ns-3.29/results/paired-experimental/**
            /tmp/reference/ns-allinone-3.29/ns-3.29/results/paired-reference/**
            paper-reproduction/progress_validation_summary.csv
            paper-reproduction/compare_progress_validation.py

      - name: Publish paired validation evidence
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/progress-publish
          cp -r ns-allinone-3.29/ns-3.29/results/paired-experimental /tmp/progress-publish/ || true
          cp -r /tmp/reference/ns-allinone-3.29/ns-3.29/results/paired-reference /tmp/progress-publish/ || true
          cp paper-reproduction/progress_validation_summary.csv /tmp/progress-publish/ || true
          git checkout --orphan progress-validation-publish
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p published-results
          cp -r /tmp/progress-publish/. published-results/ || true
          printf '%s\n' "${GITHUB_SHA}" > published-results/source_commit.txt
          git add published-results
          git commit -m "Publish paired progress validation [skip ci]"
          git push origin HEAD:progress-validation --force
