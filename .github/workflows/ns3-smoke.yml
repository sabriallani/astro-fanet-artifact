name: ns-3 smoke validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ns-allinone-3.29/ns-3.29/**"
      - "paper-reproduction/**"
      - "tests/**"
      - ".github/workflows/ns3-smoke.yml"
  push:
    branches:
      - main
      - "revision/**"
    paths:
      - "ns-allinone-3.29/ns-3.29/**"
      - "paper-reproduction/**"
      - "tests/**"
      - ".github/workflows/ns3-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: Build and run one ns-3 smoke test
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python compatible with ns-3.29 Waf
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repository tests
        run: python -m unittest discover -s tests -v

      - name: Configure ns-3
        working-directory: ns-allinone-3.29/ns-3.29
        run: ./waf configure --disable-werror

      - name: Build ns-3 with bounded parallelism
        working-directory: ns-allinone-3.29/ns-3.29
        run: ./waf build -j2

      - name: Run one short smoke test
        working-directory: .
        run: >-
          python paper-reproduction/run_a3dbsm_paper_campaign.py
          --campaign smoke
          --skip-build
          --parallel 1
          --output-dir results/ci-smoke

      - name: Validate generated CSV and summarize metrics
        working-directory: .
        run: >-
          python paper-reproduction/summarize_a3dbsm_results.py
          --results-dir ns-allinone-3.29/ns-3.29/results/ci-smoke

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns3-smoke-evidence
          if-no-files-found: warn
          path: |
            ns-allinone-3.29/ns-3.29/results/ci-smoke/**
            ns-allinone-3.29/ns-3.29/build/config.log
            paper-reproduction/a3dbsm_summary.csv
