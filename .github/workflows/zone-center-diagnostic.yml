name: zone-center suppression diagnostic

on:
  push:
    branches:
      - experiment/a3d-zone-center-pilot

permissions:
  contents: write

jobs:
  diagnostic:
    if: contains(github.event.head_commit.message, '[diagnostic]')
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repository tests
        run: python -m unittest discover -s tests -v

      - name: Configure Waf compatibility
        shell: bash
        run: |
          set -euo pipefail
          root=ns-allinone-3.29/ns-3.29
          python - "$root" <<'PY'
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          replacements = 0
          for path in root.glob('.waf*/waflib/Utils.py'):
              text = path.read_text()
              updated = text.replace("open(fname,m)as f", "open(fname,m.replace('U',''))as f")
              if updated != text:
                  path.write_text(updated)
                  replacements += 1
          print(root, "patched", replacements)
          if replacements == 0:
              raise SystemExit(f"No generated Waf Utils.py found in {root}")
          PY

      - name: Build simulator
        run: |
          set -euo pipefail
          cd ns-allinone-3.29/ns-3.29
          ./waf configure --disable-werror
          ./waf build -j2

      - name: Run four-run diagnostic
        shell: bash
        run: |
          set -u
          root=ns-allinone-3.29/ns-3.29
          output=results/zone-center-diagnostic
          mkdir -p "$root/$output"
          : > "$root/$output/status.tsv"
          failures=0
          for mobility in gm3d rpgm; do
            for byz in 0.0 0.2; do
              label="astro_n60_${mobility}_s3001_bz${byz}"
              out_dir="$root/$output/$label"
              mkdir -p "$out_dir"
              if (
                cd "$root"
                ./waf --run "astro-fanet-sim --protocol=astro --nUavs=60 --mobility=${mobility} --seed=3001 --simTime=30 --pktRate=1.0 --byzFraction=${byz} --outputDir=${output}/${label}"
              ) > "$out_dir/${label}.console.log" 2>&1; then
                printf '%s\tOK\n' "$label" >> "$root/$output/status.tsv"
              else
                printf '%s\tFAIL\n' "$label" >> "$root/$output/status.tsv"
                failures=$((failures + 1))
              fi
            done
          done
          cat "$root/$output/status.tsv"
          test "$failures" -eq 0

      - name: Aggregate diagnostic CSVs
        if: always()
        run: |
          python paper-reproduction/aggregate_baseline_campaign.py \
            --results ns-allinone-3.29/ns-3.29/results/zone-center-diagnostic \
            --output paper-reproduction/zone_center_diagnostic_summary.csv \
            --raw-output paper-reproduction/zone_center_diagnostic_raw.csv

      - name: Archive diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dest=paper-reproduction/pilot-artifacts/zone-center-diagnostic
          mkdir -p "$dest"
          cp ns-allinone-3.29/ns-3.29/results/zone-center-diagnostic/status.tsv "$dest/status.tsv"
          cp paper-reproduction/zone_center_diagnostic_summary.csv "$dest/summary.csv"
          cp paper-reproduction/zone_center_diagnostic_raw.csv "$dest/raw.csv"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -m "Archive zone-center diagnostic evidence [skip ci]" || true
          git push origin HEAD:pilot-zone-center-evidence --force

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zone-center-diagnostic
          path: |
            ns-allinone-3.29/ns-3.29/results/zone-center-diagnostic
            paper-reproduction/zone_center_diagnostic_summary.csv
            paper-reproduction/zone_center_diagnostic_raw.csv
            paper-reproduction/pilot-artifacts/zone-center-diagnostic
          if-no-files-found: warn
